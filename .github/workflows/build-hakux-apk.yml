
name: Build X1 BOX hakuX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/hakux-hd-video-modes
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang lld pkg-config \
            python3 git

      - name: Check hakuX patch
        shell: bash
        run: |
          echo "Checked-out commit:"
          git rev-parse HEAD

          echo "Checking hakuX AV-pack patch..."
          if grep -Fq \
            'nc_vm_wr32(k->vm, s, av_pack_smc());' \
            android/hakux/core/native/kernel/ex.c; then
            echo "AV-pack patch found."
          else
            echo "ERROR: AV-pack patch not found!"
            exit 1
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          cd android
          chmod +x gradlew

          ./gradlew --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug \
            2>&1 | tee ../build-logs/gradle-build.log

      - name: List generated APK files
        if: success()
        shell: bash
        run: |
          find android/app/build/outputs \
            -type f -name '*.apk' -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-hakuX-debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-build-log
          path: build-logs/
          if-no-files-found: ignore
