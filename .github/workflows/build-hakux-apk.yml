name: Build X1 BOX Community APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: feature/auto-aspect-ratio
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Linux build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build meson clang lld pkg-config \
            python3 python3-pip git curl
          meson --version
          ninja --version
          cmake --version

      - name: Setup Rust for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android --toolchain stable
          rustup target list --installed | grep -Fxq aarch64-linux-android

      - name: Prepare adrenotools patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/hakux/patches/adrenotools-kgsl-context-priority.patch"
          if [ -s "$TARGET" ]; then
            echo "Required patch already exists."
          elif [ -s "android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cp android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch "$TARGET"
          else
            echo "Downloading upstream hakuX patch..."
            mkdir -p "$(dirname "$TARGET")"
            curl --fail --location --retry 3 --output "$TARGET" \
              "https://raw.githubusercontent.com/rfandango/hakuX/master/tools/native/adrenotools-kgsl-context-priority.patch"
          fi
          test -s "$TARGET"
          wc -c "$TARGET"

      - name: Verify release fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nc_vm_wr32(k->vm, s, av_pack_smc());' android/hakux/core/native/kernel/ex.c
          grep -Fq '#define NC_KERNEL_SIZE   0x00020000u' android/hakux/core/native/kernel/kernel.h
          grep -Fq '_Static_assert(K_FAST_END <= NC_KERNEL_SIZE' android/hakux/core/native/kernel/kernel.c
          grep -Fq 'private fun deviceVibrator()' android/app/src/main/java/com/izzy2lost/x1box/hakux/HakuxCoreActivity.kt
          echo "All three fixes found."

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug \
            2>&1 | tee ../build-logs/gradle-build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-Community-Fixes-debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-build-log
          path: build-logs/
          if-no-files-found: ignore
