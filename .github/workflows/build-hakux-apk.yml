
name: Build X1 BOX hakuX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: fix/hakux-device-vibration
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Linux build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            meson \
            clang \
            lld \
            pkg-config \
            python3 \
            python3-pip \
            git \
            curl

          meson --version
          ninja --version
          cmake --version

      - name: Setup Rust for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android \
            --toolchain stable

          echo "Rust version:"
          rustc --version

          echo "Installed Rust targets:"
          rustup target list --installed

          rustup target list --installed \
            | grep -Fxq aarch64-linux-android

      - name: Check hakuX AV-pack fix
        shell: bash
        run: |
          echo "Checked-out commit:"
          git rev-parse HEAD

          if grep -Fq \
            'nc_vm_wr32(k->vm, s, av_pack_smc());' \
            android/hakux/core/native/kernel/ex.c; then
            echo "AV-pack fix found."
          else
            echo "ERROR: AV-pack fix missing!"
            exit 1
          fi

      - name: Prepare adrenotools patch
        shell: bash
        run: |
          set -euo pipefail

          TARGET="android/hakux/patches/adrenotools-kgsl-context-priority.patch"

          if [ -s "$TARGET" ]; then
            echo "Required patch already exists."
          elif [ -s "android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cp \
              android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch \
              "$TARGET"
          else
            echo "Downloading upstream hakuX patch..."
            mkdir -p "$(dirname "$TARGET")"

            curl --fail --location \
              --retry 3 \
              --output "$TARGET" \
              "https://raw.githubusercontent.com/rfandango/hakuX/master/tools/native/adrenotools-kgsl-context-priority.patch"
          fi

          test -s "$TARGET"
          echo "Patch ready:"
          wc -c "$TARGET"

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-logs
          cd android
          chmod +x gradlew

          ./gradlew --no-daemon \
            --stacktrace \
            --console=plain \
            assembleDebug \
            2>&1 | tee ../build-logs/gradle-build.log

      - name: List generated APK files
        if: success()
        shell: bash
        run: |
          find android/app/build/outputs \
            -type f -name '*.apk' -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-hakuX-debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-build-log
          path: build-logs/
          if-no-files-found: ignore
