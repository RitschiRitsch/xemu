name: Build signed X1 BOX Community APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/community-v1.1.0
          persist-credentials: false
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Linux build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build meson clang lld pkg-config \
            python3 python3-pip git curl
          meson --version
          ninja --version
          cmake --version

      - name: Setup Rust for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android --toolchain stable
          rustup target list --installed | grep -Fxq aarch64-linux-android

      - name: Prepare adrenotools patch
        shell: bash
        run: |
          set -euo pipefail
          TARGET="android/hakux/patches/adrenotools-kgsl-context-priority.patch"
          if [ -s "$TARGET" ]; then
            echo "Required patch already exists."
          elif [ -s "android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch" ]; then
            mkdir -p "$(dirname "$TARGET")"
            cp android/hakux/core/tools/native/adrenotools-kgsl-context-priority.patch "$TARGET"
          else
            echo "Downloading upstream hakuX patch..."
            mkdir -p "$(dirname "$TARGET")"
            curl --fail --location --retry 3 --output "$TARGET" \
              "https://raw.githubusercontent.com/rfandango/hakuX/a7cdb5a975e31730d488c47f6f10440b16c1e6f4/tools/native/adrenotools-kgsl-context-priority.patch"
          fi
          test -s "$TARGET"
          echo "072b41dd88fcdbb80ba9d650148275435c877fdb4ff8cdb7522e9084ec2a2731  $TARGET" | sha256sum -c -

      - name: Build unsigned Android release APK
        shell: bash
        run: |
          mkdir -p build-logs unsigned
          git rev-parse HEAD > unsigned/source-commit.txt
          cd android
          bash ./gradlew --no-daemon --stacktrace --console=plain :app:assembleRelease \
            2>&1 | tee ../build-logs/gradle-build.log
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../unsigned/

      - name: Pass APK to signing job
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-unsigned-build
          path: unsigned/
          retention-days: 1
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-build-log
          path: build-logs/
          if-no-files-found: ignore

  sign:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@v4
        with:
          name: X1BOX-unsigned-build
          path: unsigned

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android signing tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.1.0'

      - name: Sign and verify APK
        shell: bash
        env:
          X1BOX_KEYSTORE_B64: ${{ secrets.X1BOX_KEYSTORE_B64 }}
          X1BOX_SIGNING_PASSWORD: ${{ secrets.X1BOX_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          : "${X1BOX_KEYSTORE_B64:?Missing X1BOX_KEYSTORE_B64}"
          : "${X1BOX_SIGNING_PASSWORD:?Missing X1BOX_SIGNING_PASSWORD}"
          umask 077
          signing_dir=$(mktemp -d)
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$X1BOX_KEYSTORE_B64" | base64 --decode > "$signing_dir/x1box.p12"
          unset X1BOX_KEYSTORE_B64
          build_tools="$ANDROID_HOME/build-tools/36.1.0"
          mkdir -p signed
          apk="X1BOX-Community-v1.1.0-arm64.apk"
          "$build_tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$signing_dir/aligned.apk"
          "$build_tools/apksigner" sign --ks "$signing_dir/x1box.p12" --ks-type PKCS12 \
            --ks-key-alias x1box-community --ks-pass env:X1BOX_SIGNING_PASSWORD \
            --out "signed/$apk" "$signing_dir/aligned.apk"
          unset X1BOX_SIGNING_PASSWORD
          "$build_tools/apksigner" verify --verbose --print-certs "signed/$apk"
          "$build_tools/zipalign" -c -P 16 4 "signed/$apk"
          "$build_tools/aapt" dump badging "signed/$apk" > "$signing_dir/badging.txt"
          grep -F "package: name='com.izzy2lost.x1box.community' versionCode='35' versionName='1.3.3-community.1'" "$signing_dir/badging.txt"
          unzip -Z1 "signed/$apk" > "$signing_dir/entries.txt"
          grep -Fx 'lib/arm64-v8a/libhakuxcore.so' "$signing_dir/entries.txt"
          cp unsigned/source-commit.txt signed/
          cd signed
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: X1BOX-signed-community-v1.1.0
          path: signed/
          if-no-files-found: error
